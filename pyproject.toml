[project]
name = "smart-task-hub"
version = "0.1.0"
description = "Standalone MCP server for Smart Task Hub"
dependencies = [
    "fastmcp",
    "psycopg2-binary",
    "python-dotenv",
    "httpx",
    "pyyaml",
    "pytest",
    "pytest-asyncio",
    "respx",
    "dateutils"
]

[tool.setuptools]
py-modules = ["db", "logic", "server", "supervisor"]

[project.scripts]
smart-task-hub = "server:mcp.run"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
